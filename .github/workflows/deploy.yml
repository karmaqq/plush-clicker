name: Oyun Guncellemesi

on:
  push:
    branches: [main]
    paths-ignore:
      - "release/**"
      - "dist-web/**"
      - "*.md"

permissions:
  contents: write
  pages: write

env:
  VERSION_OFFSET: 0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Surum numarasi uret
        id: ver
        run: |
          N=$(($(git rev-list --count HEAD) - VERSION_OFFSET))
          X=$((1 + N / 100))
          Y=$(((N / 10) % 10))
          Z=$((N % 10))
          VERSION="${X}.${Y}.${Z}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "[surum] N=${N}, versiyon=v${VERSION}"

      - name: Surum dosyalarini guncelle
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          echo "[guncelle] index.html meta tag guncelleniyor..."
          sed -i "s|<meta name=\"version\" content=\"[^\"]*\"|<meta name=\"version\" content=\"${VERSION}\"|" index.html
          echo "[guncelle] package.json versiyonu guncelleniyor..."
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"${VERSION}\"|" package.json
          echo "[guncelle] tamamlandi: v${VERSION}"

      - name: Manifest uret
        run: node tools/generate-manifest.mjs dist-web
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}

      - name: GitHub Pages yayinla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "v${{ steps.ver.outputs.version }} yayinlandi"

      - name: Surum degisikliklerini commit et
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html package.json
          git diff --cached --quiet && echo "[commit] degisiklik yok, atlanıyor" && exit 0
          git commit -m "v${VERSION}"
          git push
          echo "[commit] v${VERSION} push edildi"

      - name: GitHub Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Plush Clicker v${{ steps.ver.outputs.version }}
          generate_release_notes: true

      - name: Pages durumunu kontrol et
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          if [ "$CODE" = "404" ]; then
            echo "::warning::Pages sitesi henuz etkin degil."
          else
            echo "[pages] etkin (${CODE})"
          fi
