name: Deploy Oyun Guncellemesi

on:
  push:
    branches: [main]
    paths-ignore:
      - "release/**"
      - "dist-web/**"
      - "*.md"

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Manifest uret ve yayin klasorunu hazirla
        run: node tools/generate-manifest.mjs dist-web

      - name: GitHub Pages yayinla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy oyun guncellemesi ${{ github.sha }}"

      - name: Pages sitesini etkinlestir
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "Mevcut pages durumu kodu: $CODE"
          if [ "$CODE" = "404" ]; then
            HTTP=$(curl -s -o /tmp/pages-resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')
            cat /tmp/pages-resp.json
            echo "POST durum kodu: $HTTP"
            if [ "$HTTP" != "201" ] && [ "$HTTP" != "200" ]; then
              echo "::error::Pages sitesi olusturulamadi (HTTP $HTTP)"
              exit 1
            fi
            echo "Pages sitesi olusturuldu"
          else
            echo "Pages zaten etkin"
          fi
