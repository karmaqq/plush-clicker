name: Oyun Guncellemesi

on:
  push:
    branches: [main]
    paths-ignore:
      - "release/**"
      - "dist-web/**"
      - "*.md"

permissions:
  contents: write
  pages: write

env:
  VERSION_ANCHOR: 011d5eff6876d1ce70e144b4995e71a130fb71ef

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Surum numarasi uret
        id: ver
        run: |
          N=$(git rev-list --count ${VERSION_ANCHOR}..HEAD)
          X=$((1 + N / 100))
          Y=$(((N / 10) % 10))
          Z=$((N % 10))
          echo "version=${X}.${Y}.${Z}" >> "$GITHUB_OUTPUT"
          echo "Surum: ${X}.${Y}.${Z} (degisiklik no: $N)"

      - name: Manifest uret ve yayin klasorunu hazirla
        run: node tools/generate-manifest.mjs dist-web
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}

      - name: GitHub Pages yayinla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Oyun guncellemesi ${{ steps.ver.outputs.version }}"

      - name: Pages durumunu kontrol et
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          if [ "$CODE" = "404" ]; then
            echo "::warning::Pages sitesi henuz etkin degil. Repo > Settings > Pages > Source: gh-pages secin (tek seferlik)."
          else
            echo "Pages etkin ($CODE)"
          fi
